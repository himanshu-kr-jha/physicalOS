[project]
name = "physicalos"
version = "0.1.0"
description = "PhysicalOS - spatial intelligence from ordinary video. The physical world tells the truth."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",
    "gpxpy>=1.6",
    "pillow>=10.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "onnxruntime-gpu>=1.24.3",
    # PDF inspection reports (`pos report`). BSD-licensed, pure Python.
    "reportlab>=4.0",
    # Multipart form parsing, so the web UI can accept a video + GPX upload.
    "python-multipart>=0.0.9",
    "supervision>=0.29.1",
    "torch>=2.13.0",
    "open-clip-torch>=3.3.0",
    "torchvision>=0.28.0",
]

[project.scripts]
pos = "pos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pos"]

# CUDA torch for GPU instances (Tesla T4 / CUDA 13.0 driver).
# The cu124 wheels are backward-compatible with any driver >= 525.
# torchvision MUST come from the same index as torch — a mismatch installs
# two builds compiled against different ABIs, and the failure is not an
# install error but `RuntimeError: operator torchvision::nms does not exist`
# at import time from inside open_clip.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
